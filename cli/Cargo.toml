[workspace]
members = ["crates/syntax", "crates/canon", "crates/graph", "crates/plan", "crates/apply", "crates/gate", "crates/adopt", "crates/cli"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
intlang-syntax = { path = "crates/syntax" }
intlang-canon = { path = "crates/canon" }
intlang-graph = { path = "crates/graph" }
intlang-plan = { path = "crates/plan" }
intlang-apply = { path = "crates/apply" }
intlang-gate = { path = "crates/gate" }
intlang-adopt = { path = "crates/adopt" }
logos = "0.16"
serde = { version = "1", features = ["derive"] }
# arbitrary_precision keeps number text exact, so canonical JSON can write it exactly.
serde_json = { version = "1", features = ["arbitrary_precision"] }
clap = { version = "4.6", features = ["derive"] }
codespan-reporting = { version = "0.13", default-features = false, features = ["std"] }
walkdir = "2.5"
sha2 = "0.11"
rustix = { version = "1", default-features = false, features = ["std", "process"] }
unicode-normalization = "0.1"

[workspace.lints.rust]
unsafe_code = "forbid"
